<style>
/* ASCEND preview — the mobile app's design tokens: one restrained blue, hairline borders, Inter. Layout: a single phone-width column with a fixed bottom tab bar. */
:root {

.seg button.on { background: var(--surface); border-color: var(--border); color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid transparent; background: var(--surface-2); color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; }

.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--text-2); vertical-align: 1px; }

.lock { color: var(--text-3); font-size: 8px; margin-left: 6px; vertical-align: 2px; }
.goal-list { display: flex; flex-direction: column; gap: 8px; }

.goal-row.dragging { opacity: .7; border-color: var(--accent); }

.handle { cursor: grab; color: var(--text-3); padding: 8px 4px; touch-action: none; user-select: none; letter-spacing: -2px; }
.prio { font-size: 12.5px; font-weight: 600; color: var(--text-3); width: 14px; text-align: center; font-variant-numeric: tabular-nums; }
.arrows { display: flex; flex-direction: column; gap: 2px; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.cal-h { font-size: 12px; color: var(--text-3); padding-bottom: 2px; }

.cal-d.sched { border-color: var(--border); }

.cal-d:disabled { color: var(--text-3); cursor: default; }
.daygrid { position: relative; margin-top: 6px; }
.hour { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--border); }

.dg-item { position: absolute; display: flex; align-items: flex-start; left: 52px; right: 0; border-radius: 8px; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); padding: 2px 8px; font-size: 12.5px; font-weight: 500; overflow: hidden; text-align: left; white-space: nowrap; text-overflow: ellipsis; }

.dg-item.is-done { color: var(--text-3); text-decoration: line-through; }

.now-line { position: absolute; left: 48px; right: 0; height: 2px; background: var(--accent); border-radius: 1px; }
.wd { width: 40px; font-size: 12px; color: var(--text-2); text-align: center; flex: none; }

.sheet { width: 100%; max-width: 480px; max-height: 88%; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 8px 16px; gap: 8px; }
.sheet-body { overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet-foot { padding: 10px 16px 14px; border-top: 1px solid var(--border); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center; background: var(--tabbar); border-top: 1px solid var(--border); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.tabbar button { flex: 1; max-width: 96px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--text-3); font-size: 11px; font-weight: 500; cursor: pointer; }
.tabbar button.on { color: var(--text); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; width: min(440px, calc(100% - 32px)); background: var(--toast-bg); color: var(--toast-fg); border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; font-size: 14px; }

@media (min-width: 720px) { .app { padding-top: 16px; } }
